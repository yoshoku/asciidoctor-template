name: textlint

on:
  - push
  - pull_request

jobs:
  textlint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install
      run: npm install
    - name: Check texts
      run: npx textlint src/*.adoc
